[build]
  command = "npm --prefix apps/music-universe ci --include=dev && npm run build -- --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  included_files = ["src/db/postgres-migrations/**", "integrations/mineradio/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Source ZIP builds need this explicit adapter declaration. Let Netlify install
# the maintained current version; do not pin a second copy in package.json.
# DATABASE_URL, MUSIC_CREDENTIAL_SECRET, APP_ORIGIN, MUSIC_DESKTOP_LOGIN=0 and
# MUSIC_AUDIO_RESPONSE_BYTES=4194304 must be configured in the site environment.
# Free uses default scopes; mark credentials as secrets in production context.
# Secrets must never be committed or exposed through NEXT_PUBLIC_* variables.
