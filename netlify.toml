[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/universe/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https: http://127.0.0.1:43891; font-src 'self' data:; media-src 'self' blob: data: https: http://127.0.0.1:43891; connect-src 'self' https: http://127.0.0.1:43891; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'self';"
