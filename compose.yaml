services:
  music-world:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      DATABASE_URL: ${DATABASE_URL:?Set a direct PostgreSQL connection URL}
      MUSIC_CREDENTIAL_SECRET: ${MUSIC_CREDENTIAL_SECRET:?Set a fixed secret of at least 32 characters}
      MUSIC_DESKTOP_LOGIN: "0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
