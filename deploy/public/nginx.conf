# Install in /etc/nginx/sites-available/music-world (Ubuntu).
# Replace music.example.com, then use Certbot to add TLS and HTTP->HTTPS.
# Both limit zones belong in the http context; Ubuntu includes this file there.
limit_req_zone $binary_remote_addr zone=music_world_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=music_world_connections:10m;

server {
    listen 80;
    server_name music.example.com;
    client_max_body_size 12m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    location /api/ {
        limit_req zone=music_world_api burst=30 nodelay;
        limit_req_status 429;
        limit_conn music_world_connections 20;
        # Authorization codes and short-lived audio tickets are query parameters.
        access_log off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3000;
    }

    location /universe/assets/ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_pass http://127.0.0.1:3000;
    }

    location = /universe/index.html {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3000;
    }
}
